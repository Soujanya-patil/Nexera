# Apache 2.4 for the local suites: the built site served with its own public/.htaccess, as on Hostinger.
#   8810  tests/.work/web     a copy of dist (prepare.sh)
#   8811  tests/.work/before  a reference build (make-reference.sh), for the hub suite and Lighthouse A/B
# Started by start-servers.sh, which sets APACHE_ROOT (the Apache install) and NEXERA_TESTS_WORK
# (tests/.work, absolute) in the environment; Apache substitutes ${…} from it.
ServerRoot "${APACHE_ROOT}"
Listen 127.0.0.1:8810
Listen 127.0.0.1:8811
ServerName localhost:8810
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule filter_module modules/mod_filter.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule alias_module modules/mod_alias.so
TypesConfig conf/mime.types
DirectoryIndex index.html
PidFile "${NEXERA_TESTS_WORK}/httpd.pid"
<Directory "${NEXERA_TESTS_WORK}/web">
  Options FollowSymLinks
  AllowOverride All
  Require all granted
</Directory>
<Directory "${NEXERA_TESTS_WORK}/before">
  Options FollowSymLinks
  AllowOverride All
  Require all granted
</Directory>
<VirtualHost 127.0.0.1:8810>
  DocumentRoot "${NEXERA_TESTS_WORK}/web"
</VirtualHost>
<VirtualHost 127.0.0.1:8811>
  DocumentRoot "${NEXERA_TESTS_WORK}/before"
</VirtualHost>
ErrorLog "${NEXERA_TESTS_WORK}/httpd-error.log"
LogLevel warn
